name: Vexryn agent config review
description: >-
  Comments on a pull request with what its AI-agent config changes let the
  agent do and load. Static read of the config files — nothing from the PR is
  executed, nothing is sent anywhere but the comment. Non-blocking unless
  `strict: true`.
inputs:
  strict:
    description: "Fail the check while a ⚠️ finding is open (accept one in .vexryn.json on the base branch)."
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Build vexryn
      shell: bash
      working-directory: ${{ github.action_path }}
      # ponytail: builds from source at the pinned ref on each run (~20 s), so the Action and its code never
      # drift apart; switch to `npx vexryn@<version>` if the build time starts to matter.
      run: npm ci --ignore-scripts --no-audit --no-fund && npm run build

    - name: Review agent config changes
      shell: bash
      env:
        VEXRYN_TOKEN: ${{ github.token }}
        STRICT: ${{ inputs.strict }}
      # Same command as every other CI: `vexryn ci` finds the PR, reviews it, keeps one comment up to date.
      run: |
        if [ "$STRICT" = "true" ]; then set -- --strict; fi
        node "$GITHUB_ACTION_PATH/dist/cli.js" ci . "$@"
