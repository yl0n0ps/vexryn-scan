<svg xmlns="http://www.w3.org/2000/svg" width="820" height="524" viewBox="0 0 820 524" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
  <style>
    .fg{fill:#EEF1FA}.muted{fill:#8B93AC}.faint{fill:#565E7E}.blue{fill:#4A90FF}.violet{fill:#C46BFF}
    .amber{fill:#E6B23C}.coral{fill:#FF5A4E}.b{font-weight:700}
    .word{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:500;letter-spacing:-0.5}
  </style>
  <rect width="820" height="524" rx="12" fill="#0A0E27"/>
  <rect width="820" height="36" rx="12" fill="#141A33"/><rect y="24" width="820" height="12" fill="#141A33"/>
  <circle cx="20" cy="18" r="6" fill="#FF5A4E"/><circle cx="40" cy="18" r="6" fill="#E6B23C"/><circle cx="60" cy="18" r="6" fill="#37C98B"/>
  <text x="410" y="23" text-anchor="middle" class="faint" font-size="12">vexryn — agent load report</text>
  <g transform="translate(24,62)">
    <!-- banner: the woven-X mark + wordmark -->
    <g transform="translate(0,-4) scale(0.42)"><path d="M48 16 L38.5 25.5 M25.5 38.5 L16 48" stroke="#EEF1FA" stroke-width="8.5"/><path d="M16 16 L48 48" stroke="#4A90FF" stroke-width="8.5"/></g>
    <text x="40" y="16" class="word fg" font-size="26">ve<tspan class="blue b">x</tspan>ryn</text>
    <text x="150" y="16" class="faint" font-size="13">v0.3.0</text>
    <rect x="2" y="30" width="150" height="2" fill="url(#g)"/>
    <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#4A90FF"/><stop offset="1" stop-color="#C46BFF"/></linearGradient></defs>
    <text y="52" class="muted" font-size="13">see what your agent loads — and what it can do</text>
    <text y="86" class="faint">$ </text><text x="16" y="86" class="fg">npx vexryn scan</text>
    <text y="114" class="fg">Found 3 agent configs, 4 MCP servers across 2 agents</text>
    <text y="146" class="coral b">⚠ One agent can read the web, read your files and send them out.</text>
    <text y="168" class="coral">1 secret written in plain text in a config file.</text>
    <text y="190" class="amber">2 servers run a package its publisher has deprecated.</text>
    <text y="212" class="muted">Across your agents, tools can: <tspan class="violet">send messages, read files, run commands…</tspan></text>
    <text y="250" class="fg b">CLAUDE CODE  — 3 servers, 23 tools</text>
    <text y="272"><tspan class="blue">slack</tspan><tspan class="faint" dx="56">8 tools · catalog @modelcontextprotocol/server-slack</tspan></text>
    <text y="294" dx="16"><tspan class="muted">can: </tspan><tspan class="violet">send messages to external recipients</tspan></text>
    <text y="316" dx="16" class="coral">⚠ uses server-slack, marked deprecated by its publisher</text>
    <text y="344"><tspan class="blue">filesystem</tspan><tspan class="faint" dx="28">14 tools · can: read files, create, edit or delete files</tspan></text>
    <text y="366" dx="16" class="coral">⚠ is given /  — a whole filesystem/home or a credential path</text>
    <text y="406" class="faint">100% local · nothing was sent · nothing was executed</text>
  </g>
</svg>
